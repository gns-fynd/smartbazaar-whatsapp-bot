[project]
name = "smartbazaar-shopping-agent"
version = "0.1.0"
description = "WhatsApp JioMart shopping agent with typed tools, memory and media input"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.8,<3",
  "cryptography>=44,<47",
  "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
